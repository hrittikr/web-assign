<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox level 5-center</title>
    <style>
        .container {
            display: flex;
            height: 250px;
            border: 2px solid rgb(145, 168, 210);
            justify-content: center;
            align-items: center;
            background-color:rgb(239, 226, 226);
        }
        .Box {
            width: 60px;
            height: 60px;
            background-color: rgb(190, 110, 45);
            color: rgb(245, 236, 236);
            text-align: center;
            line-height: 60px;
            margin: 5px;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h2>Level-5 Center everything using justify-content and align-items </h2>
    
    <div class="container">
        <div class="Box">A</div>
        <div class="Box">B</div>
        <div class="Box">C</div>
    </div>
    </body>
</html>
